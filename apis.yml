name: Fabletics
description: 'Fabletics is an American athleisure and activewear brand co-founded in
  2013 by actress Kate Hudson with Adam Goldenberg and Don Ressler under the TechStyle
  Fashion Group in El Segundo, California. It sells women''s and men''s (FL2) activewear,
  leggings, sports bras, accessories, the Yitty shapewear line, and Fabletics Scrubs
  through a VIP membership subscription model that gives members monthly credits and
  member pricing, operating omnichannel across its e-commerce site and a growing footprint
  of brick-and-mortar retail stores. As a direct-to-consumer retailer, Fabletics does
  not publish a public developer API; this profile captures its identity and public
  web surface for the API Evangelist network.'
